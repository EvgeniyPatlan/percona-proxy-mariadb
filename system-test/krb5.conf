[logging]
 default = FILE:/var/log/krb5libs.log
 kdc = FILE:/var/log/krb5kdc.log
 admin_server = FILE:/var/log/kadmind.log

[libdefaults]
 dns_lookup_realm = false
 ticket_lifetime = 24h
 renew_lifetime = 7d
 forwardable = true
 rdns = false
 default_realm = PERCONA_PROXY.TEST
 default_ccache_name = KEYRING:persistent:%{uid}

[realms]
 PERCONA_PROXY.TEST = {
  kdc = percona-proxy.percona-proxy.test
  admin_server = percona-proxy.percona-proxy.test
 }

[domain_realm]
 .percona-proxy.test = PERCONA_PROXY.TEST
 percona-proxy.test = PERCONA_PROXY.TEST

